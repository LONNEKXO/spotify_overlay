<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LONNEKXO — Spotify Now Playing</title>
  <style>

    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { background: transparent; overflow: hidden; font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #f5f5f5; }
    :root { --panel: rgba(10,11,13,.91); --stroke: rgba(255,255,255,.16); --muted: #989ba0; }
    .wrap { position: fixed; left: 42px; bottom: 42px; z-index: 10; opacity: 0; transform: translateY(12px); transition: opacity .42s ease, transform .42s cubic-bezier(.2,.7,.2,1); pointer-events: none; }
    .wrap.visible { opacity: 1; transform: translateY(0); }
    .card { display: flex; align-items: center; gap: 16px; position: relative; isolation: isolate; overflow: hidden; padding: 13px 18px 13px 13px; min-height: 86px; border: 1px solid var(--stroke); border-radius: 16px; background: var(--panel); box-shadow: 0 16px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.045); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: width .32s cubic-bezier(.2,.7,.2,1); }
    .card::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 15% 0%, rgba(255,255,255,.055), transparent 62%); }
    .card::after { content: ''; position: absolute; top: 0; left: 16px; width: 54px; height: 1px; background: rgba(255,255,255,.68); box-shadow: 0 0 14px rgba(255,255,255,.28); }
    .vinyl { display: none; }
    .cover { width: 58px; height: 58px; flex: 0 0 58px; position: relative; overflow: hidden; border-radius: 9px; border: 1px solid rgba(255,255,255,.13); background: #191a1c; box-shadow: 0 5px 16px rgba(0,0,0,.35); }
    .cover img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08); }
    .meta { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 5px; min-width: 0; flex: 1; }
    .artist { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track { font-size: 15px; line-height: 1.25; font-weight: 750; letter-spacing: .025em; color: #f5f5f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progressRow { display: flex; align-items: center; gap: 9px; margin-top: 4px; }
    .time { flex: 0 0 32px; width: 32px; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .015em; color: #a3a5a8; text-align: center; user-select: none; }
    .bar { position: relative; flex: 1 1 auto; min-width: 110px; height: 3px; overflow: hidden; border-radius: 3px; background: rgba(255,255,255,.16); }
    .barFill { width: 0%; height: 100%; border-radius: 3px; background: #e6e7e9; box-shadow: 0 0 9px rgba(255,255,255,.2); transition: width .2s linear; }
    @media (max-width: 780px) { .wrap { left: 18px; bottom: 18px; } .card { padding: 10px 13px 10px 10px; gap: 12px; } .cover { width: 48px; height: 48px; flex-basis: 48px; } }
    @media (prefers-reduced-motion: reduce) { .wrap, .card, .barFill { transition: none; } }
  </style>
</head>

<body>
  <div class="wrap" id="wrap">
    <div id="card" class="card">
      <div class="vinyl" id="vinyl"></div>
      <div class="cover">
        <img id="coverImg" alt="Okładka utworu" />
      </div>

      <div class="meta">
        <div id="artist" class="artist">Spotify</div>
        <div id="track" class="track">Łączenie…</div>

        <div class="progressRow">
          <div id="tLeft" class="time">0:00</div>
          <div class="bar"><div id="barFill" class="barFill"></div></div>
          <div id="tRight" class="time">0:00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**********************
     * USTAW:
     **********************/
    const SPOTIFY_CLIENT_ID = "0ed7689f271f4ba0afde04674e676e71";
    const REDIRECT_URI = "https://lonnekxo.github.io/spotify_overlay/"; // 1:1 jak w Spotify Dev
    const SCOPES = [
      "user-read-currently-playing",
      "user-read-playback-state"
    ].join(" ");

    /**********************
     * UI
     **********************/
    const wrap = document.getElementById("wrap");
    const card = document.getElementById("card");
    const vinyl = document.getElementById("vinyl");
    const coverImg = document.getElementById("coverImg");
    const artistEl = document.getElementById("artist");
    const trackEl = document.getElementById("track");
    const tLeft = document.getElementById("tLeft");
    const tRight = document.getElementById("tRight");
    const barFill = document.getElementById("barFill");

    function showHUD(){ wrap.classList.add("visible"); }
    function hideHUD(){ wrap.classList.remove("visible"); }

    function formatTime(ms){
      const s = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2,"0")}`;
    }

    function setIdle(){
      // Jak nic nie gra -> HUD znika
      hideHUD();
      vinyl.classList.remove("spin");
      coverImg.removeAttribute("src");
      artistEl.textContent = "—";
      trackEl.textContent = "—";
      tLeft.textContent = "0:00";
      tRight.textContent = "0:00";
      barFill.style.width = "0%";
      resizeCardToText(); // żeby po powrocie nie było glitchy
    }

    function setPlaying({artist, track, imageUrl, progressMs, durationMs}){
      // Jak gra -> HUD się pokazuje
      showHUD();
      vinyl.classList.add("spin");
      artistEl.textContent = artist || "—";
      trackEl.textContent = track || "—";
      if (imageUrl) coverImg.src = imageUrl;

      // timery
      tLeft.textContent = formatTime(progressMs);
      tRight.textContent = formatTime(durationMs);

      // bar
      const pct = durationMs ? Math.max(0, Math.min(1, progressMs / durationMs)) : 0;
      barFill.style.width = (pct * 100).toFixed(2) + "%";

      resizeCardToText();
    }

    /**********************
     * Auto-resize szerokości karty pod tekst + progress row
     **********************/
    const measureCanvas = document.createElement("canvas");
    const mctx = measureCanvas.getContext("2d");

    function textWidth(text, font){
      mctx.font = font;
      return mctx.measureText(text).width;
    }

    function resizeCardToText(){
      const artistStyle = getComputedStyle(artistEl);
      const trackStyle = getComputedStyle(trackEl);

      const artistFont = `${artistStyle.fontWeight} ${artistStyle.fontSize} ${artistStyle.fontFamily}`;
      const trackFont  = `${trackStyle.fontWeight} ${trackStyle.fontSize} ${trackStyle.fontFamily}`;

      const wA = textWidth(artistEl.textContent || "", artistFont);
      const wT = textWidth(trackEl.textContent || "", trackFont);
      const textW = Math.max(wA, wT);

      // fixed: vinyl + cover + padding + gaps + progress row (czas + czas + minimalny bar)
      const fixedLeft = 58 + 13 + 18 + 16; // vin + cover + padding + gaps
      const progressMin = 32 + 9 + 110 + 9 + 32; // left time + gap + min bar + gap + right time
      const target = fixedLeft + Math.max(textW, progressMin);

      const minW = 360;
      const maxW = Math.max(240, Math.min(window.innerWidth - 60, 720)); // rośnie szerzej niż wcześniej

      const finalW = Math.min(maxW, Math.max(Math.min(minW, maxW), Math.round(target)));
      card.style.width = finalW + "px";
    }

    window.addEventListener("resize", resizeCardToText);

    /**********************
     * PKCE helpers
     **********************/
    function base64UrlEncode(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    async function sha256(plain) {
      const enc = new TextEncoder();
      return await crypto.subtle.digest("SHA-256", enc.encode(plain));
    }
    function randomString(len = 64){
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._~";
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, x => chars[x % chars.length]).join("");
    }

    function saveTokens({access_token, refresh_token, expires_in}){
      const expiresAt = Date.now() + (expires_in * 1000) - 10_000;
      localStorage.setItem("sp_access_token", access_token);
      if (refresh_token) localStorage.setItem("sp_refresh_token", refresh_token);
      localStorage.setItem("sp_expires_at", String(expiresAt));
    }
    function clearTokens(){
      localStorage.removeItem("sp_access_token");
      localStorage.removeItem("sp_refresh_token");
      localStorage.removeItem("sp_expires_at");
      localStorage.removeItem("sp_code_verifier");
    }
    function getAccessToken(){ return localStorage.getItem("sp_access_token"); }
    function tokenExpired(){
      const t = Number(localStorage.getItem("sp_expires_at") || "0");
      return !t || Date.now() > t;
    }

    async function refreshAccessToken(){
      const refresh_token = localStorage.getItem("sp_refresh_token");
      if (!refresh_token) return null;

      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token
      });

      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: {"Content-Type":"application/x-www-form-urlencoded"},
        body
      });

      if (!res.ok) return null;

      const data = await res.json();
      saveTokens(data);
      return data.access_token;
    }

    async function startLoginAuto(){
      const code_verifier = randomString(64);
      localStorage.setItem("sp_code_verifier", code_verifier);
      const challenge = base64UrlEncode(await sha256(code_verifier));

      const params = new URLSearchParams({
        response_type: "code",
        client_id: SPOTIFY_CLIENT_ID,
        scope: SCOPES,
        redirect_uri: REDIRECT_URI,
        code_challenge_method: "S256",
        code_challenge: challenge,
      });

      window.location.href = "https://accounts.spotify.com/authorize?" + params.toString();
    }

    async function handleCallbackIfNeeded(){
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");
      const error = url.searchParams.get("error");

      if (error){
        // jak błąd, HUD chowamy
        setIdle();
        return;
      }
      if (!code) return;

      const code_verifier = localStorage.getItem("sp_code_verifier");
      if (!code_verifier){
        setIdle();
        return;
      }

      const body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: "authorization_code",
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier
      });

      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: {"Content-Type":"application/x-www-form-urlencoded"},
        body
      });

      if (!res.ok){
        setIdle();
        return;
      }

      const data = await res.json();
      saveTokens(data);

      url.searchParams.delete("code");
      url.searchParams.delete("state");
      window.history.replaceState({}, document.title, url.toString());
    }

    async function spotifyCurrentlyPlaying(token){
      const res = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
        headers: { Authorization: "Bearer " + token }
      });

      if (res.status === 204) return { isPlaying:false };
      if (res.status === 401) return { unauthorized:true };
      if (!res.ok) return { error:"HTTP " + res.status };

      const data = await res.json();
      const item = data?.item;
      const isPlaying = Boolean(data?.is_playing && item);

      if (!isPlaying) return { isPlaying:false };

      return {
        isPlaying:true,
        artist: (item.artists || []).map(a=>a.name).join(", "),
        track: item.name || "—",
        imageUrl: item.album?.images?.[0]?.url || "",
        progressMs: data.progress_ms ?? 0,
        durationMs: item.duration_ms ?? 0
      };
    }

    async function ensureToken(){
      let token = getAccessToken();
      if (!token) return null;
      if (tokenExpired()){
        token = await refreshAccessToken();
      }
      return token;
    }

    /**********************
     * Smooth timer (lokalny) + polling API
     **********************/
    let pollTimer = null;
    let smoothTimer = null;

    let curProgress = 0;
    let curDuration = 0;
    let lastSync = 0;

    function stopSmooth(){
      if (smoothTimer) clearInterval(smoothTimer);
      smoothTimer = null;
    }

    function startSmooth(){
      stopSmooth();
      smoothTimer = setInterval(() => {
        if (!wrap.classList.contains("visible")) return;
        if (!curDuration) return;

        const now = Date.now();
        const delta = now - lastSync;
        const progress = Math.min(curDuration, curProgress + delta);

        tLeft.textContent = formatTime(progress);
        const pct = Math.max(0, Math.min(1, progress / curDuration));
        barFill.style.width = (pct * 100).toFixed(2) + "%";

      }, 250);
    }

    async function startPolling(){
      if (pollTimer) clearInterval(pollTimer);

      async function tick(){
        const token = await ensureToken();

        if (!token){
          // auto-connect (1 raz na sesję) żeby nie zrobić redirect loop
          const tried = sessionStorage.getItem("sp_tried_login");
          if (!tried){
            sessionStorage.setItem("sp_tried_login","1");
            setIdle();
            await startLoginAuto();
            return;
          } else {
            setIdle();
            return;
          }
        }

        const result = await spotifyCurrentlyPlaying(token);

        if (result.unauthorized){
          const refreshed = await refreshAccessToken();
          if (!refreshed){
            clearTokens();
            setIdle();
          }
          return;
        }

        if (result.isPlaying){
          // zsynchronizuj smooth timer
          curProgress = result.progressMs;
          curDuration = result.durationMs;
          lastSync = Date.now();
          setPlaying(result);
          startSmooth();
        } else {
          stopSmooth();
          setIdle();
        }
      }

      await tick();
      pollTimer = setInterval(tick, 5000);
    }

    (async function init(){
      // start: schowane
      setIdle();
      resizeCardToText();
      await handleCallbackIfNeeded();
      await startPolling();
    })();
  </script>
</body>
</html>
